<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太平洋岸自転車道観光アンケート統計サイト - フォーム一覧</title>
    <link rel="icon" href="favicon.ico">
    <!-- OGPタグ（noteやSNSのプレビュー用） -->
    <meta property="og:title" content="ページのタイトル" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pacific-cycling.github.io/pacific-cycling-questionnaire-forms/" />
    <meta property="og:image" content="https://pacific-cycling.github.io/pacific-cycling-questionnaire-forms/ogp.jpeg" />
    <meta property="og:description" content="太平洋岸自転車道を中心とした様々な観光アンケートを取り、統計するサイト" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-square-poll-vertical text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 tracking-tight">太平洋岸自転車道アンケート統計サイト</h1>
                    <p class="text-xs text-slate-500">ご回答いただけるフォーム一覧</p>
                </div>
            </div>
            <div class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
                全 <span id="totalCount">0</span> 件のフォーム
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Search Toolbar -->
        <div class="flex items-center justify-between gap-4 mb-6">
            <div class="relative w-full max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="app.handleSearch(this.value)" placeholder="フォームを検索..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition">
            </div>
        </div>

        <!-- Card Grid -->
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards populated dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 px-4 bg-white rounded-2xl border border-dashed border-slate-300 text-center mt-4">
            <div class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-bold text-slate-900 mb-1">該当するフォームが見つかりません</h3>
            <p class="text-sm text-slate-500 max-w-sm">検索条件を変更してお試しください。</p>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-sm">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage">アクションが完了しました</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
        <p>太平洋岸自転車道アンケート統計サイト Reader &copy; 2026</p>
    </footer>

    <script>
        class GoogleFormReader {
            constructor() {
                this.forms = [];
                this.currentSearch = '';
                this.init();
            }

            async init() {
                await this.loadFormsData();
            }

            async loadFormsData() {
                try {
                    // 同じ階層にあるforms.jsonからデータを非同期で取得する
                    const response = await fetch('forms.json');
                    if (!response.ok) {
                        throw new Error('forms.jsonの読み込みに失敗しました');
                    }
                    this.forms = await response.json();
                    this.render();
                } catch (error) {
                    console.error('Data load error:', error);
                    this.showToast('フォームデータの読み込みに失敗しました', 'error');
                }
            }

            copyUrl(url) {
                const tempInput = document.createElement('textarea');
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    this.showToast('URLをクリップボードにコピーしました！', 'success');
                } catch (err) {
                    this.showToast('コピーに失敗しました', 'error');
                }
                document.body.removeChild(tempInput);
            }

            handleSearch(query) {
                this.currentSearch = query.toLowerCase().trim();
                this.renderCardsList();
            }

            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                const toastIcon = document.getElementById('toastIcon');

                toastMsg.textContent = message;
                if (type === 'success') {
                    toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
                }

                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            render() {
                document.getElementById('totalCount').textContent = this.forms.length;
                this.renderCardsList();
            }

            renderCardsList() {
                const grid = document.getElementById('cardGrid');
                const emptyState = document.getElementById('emptyState');

                let filtered = this.forms.filter(f => {
                    return !this.currentSearch || 
                        f.title.toLowerCase().includes(this.currentSearch) || 
                        (f.memo && f.memo.toLowerCase().includes(this.currentSearch));
                });

                if (filtered.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                let html = '';
                filtered.forEach(form => {
                    const memoHtml = form.memo ? `<p class="text-xs text-slate-500 mt-2 line-clamp-2">${this.escapeHtml(form.memo)}</p>` : '';

                    html += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between overflow-hidden group">
                            <div class="p-6">
                                <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-2 group-hover:text-indigo-600 transition" title="${this.escapeHtml(form.title)}">
                                    ${this.escapeHtml(form.title)}
                                </h3>
                                ${memoHtml}
                                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center text-xs text-slate-400 truncate">
                                    <i class="fa-solid fa-link mr-1.5 flex-shrink-0"></i>
                                    <span class="truncate">${this.escapeHtml(form.url)}</span>
                                </div>
                            </div>
                            <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex items-center justify-between">
                                <button onclick="app.copyUrl('${form.url}')" class="text-xs font-medium text-slate-600 hover:text-indigo-600 flex items-center space-x-1.5 py-1 transition">
                                    <i class="fa-regular fa-copy"></i>
                                    <span>URLコピー</span>
                                </button>
                                <a href="${form.url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-xl shadow-sm transition flex items-center space-x-1.5">
                                    <span>ページを開く(新しいタブ)<span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            }

            escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        }

        const app = new GoogleFormReader();
    </script>
</body>
</html>
